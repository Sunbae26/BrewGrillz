# Render blueprint for the API. Real secrets are set in the Render dashboard only (never in Git).
services:
  - type: web
    name: brewgrillz-api
    runtime: node
    rootDir: backend
    region: singapore
    plan: standard
    numInstances: 1
    buildCommand: npm ci && npm run build
    # npm start runs the database migrations and the menu update first
    startCommand: npm start
    # no database query, so Neon can sleep
    healthCheckPath: /api/ping
    envVars:
      - key: NODE_ENV
        value: production
      - key: SITE_URL
        value: https://www.brewgrillz.sg
      - key: CORS_ORIGINS
        value: https://www.brewgrillz.sg,https://brewgrillz.sg
      - key: TRUST_PROXY
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: ORDER_TOKEN_SECRET
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_SETUP_KEY
        sync: false
      - key: PAYMENT_PROVIDER
        value: stripe
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: EMAIL_PROVIDER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: BrewGrillz <info@brewgrillz.sg>
      - key: RESTAURANT_EMAIL
        value: info@brewgrillz.sg
      - key: WHATSAPP_PROVIDER
        value: "off"
      - key: SENTRY_DSN
        sync: false
